name: ZENITH Regenerate Lockfile

on:
  push:
    branches:
      - zenith/phase-3.3-settlement

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.event.head_commit.message != 'chore(ci): regenerate capacitor lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zenith/phase-3.3-settlement

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(ci): regenerate capacitor lockfile"
          git push origin HEAD:zenith/phase-3.3-settlement
