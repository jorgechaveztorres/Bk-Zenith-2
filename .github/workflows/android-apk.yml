name: ZENITH Android APK

on:
  push:
    branches:
      - zenith/phase-3.3-settlement
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Refresh package lock for declared runtime dependencies
        run: npm install --package-lock-only

      - name: Commit refreshed package lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(ci): synchronize package lock"
          git push origin HEAD:zenith/phase-3.3-settlement

      - name: Install project dependencies
        run: npm ci

      - name: Install Capacitor Android integration
        run: npm install --no-save @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7 @capacitor/geolocation@7 @capacitor/camera@7 @capacitor/local-notifications@7

      - name: Validate TypeScript
        run: npm run lint

      - name: Build web application
        env:
          VITE_API_BASE_URL: ${{ vars.ZENITH_API_BASE_URL }}
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zenith-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
