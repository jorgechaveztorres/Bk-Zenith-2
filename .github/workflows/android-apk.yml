name: ZENITH Android APK

on:
  push:
    branches:
      - zenith/phase-3.3-settlement
      - test/android-gps-permissions
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "HTTPS backend API URL for the test APK"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project dependencies
        run: npm ci

      - name: Install Capacitor Android integration
        run: npm install --no-save @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7 @capacitor/geolocation@7 @capacitor/camera@7 @capacitor/local-notifications@7

      - name: Validate TypeScript
        run: npm run lint

      - name: Resolve API URL
        id: api
        env:
          INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
          ZENITH_API_BASE_URL: ${{ vars.ZENITH_API_BASE_URL }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          API_URL="$INPUT_API_BASE_URL"
          if [ -z "$API_URL" ]; then API_URL="$ZENITH_API_BASE_URL"; fi
          if [ -z "$API_URL" ] && [ "$GITHUB_REF" = "refs/heads/test/android-gps-permissions" ]; then
            API_URL="https://zenith-preview.test"
            echo "::warning::Using placeholder preview URL; this APK may not connect to a real backend."
          fi
          test -n "$API_URL"
          case "$API_URL" in
            https://*) ;;
            *) echo "API URL must use HTTPS"; exit 1 ;;
          esac
          echo "api_base_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Build web application
        env:
          VITE_API_BASE_URL: ${{ steps.api.outputs.api_base_url }}
          GOOGLE_MAPS_PLATFORM_KEY: ${{ secrets.GOOGLE_MAPS_PLATFORM_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_PLATFORM_KEY" ]; then
            echo "::error::Missing repository secret GOOGLE_MAPS_PLATFORM_KEY"
            exit 1
          fi
          npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Configure Android permissions and manifest
        run: node scripts/patch-android-manifest.cjs

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zenith-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
