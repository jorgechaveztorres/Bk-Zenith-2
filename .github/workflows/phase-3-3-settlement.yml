name: ZENITH Phase 3.4 Financial Reconciliation Audit

# CI trigger validation for Phase 3.4.

on:
  push:
    branches:
      - zenith/phase-3.4-reconciliation
  workflow_dispatch:

jobs:
  financial-reconciliation-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java runtime
        run: java -version

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Ride settlement audit
        run: npm run test:settlement

      - name: Financial reconciliation audit
        run: npm run test:financial-reconciliation
