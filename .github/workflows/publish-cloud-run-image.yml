name: Publish ZENITH Container

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: zenith-container-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
        run: |
          set -eu
          test -n "$GCP_PROJECT_ID" || { echo 'Missing repository variable GCP_PROJECT_ID'; exit 1; }
          test -n "$GCP_REGION" || { echo 'Missing repository variable GCP_REGION'; exit 1; }
          test -n "$AR_REPOSITORY" || { echo 'Missing repository variable AR_REPOSITORY'; exit 1; }
          test -n "$WIF_PROVIDER" || { echo 'Missing repository secret GCP_WIF_PROVIDER'; exit 1; }
          test -n "$WIF_SERVICE_ACCOUNT" || { echo 'Missing repository secret GCP_WIF_SERVICE_ACCOUNT'; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and publish immutable commit image
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/zenith-backend:${COMMIT_SHA}"
          docker build --pull -t "$IMAGE" .
          docker push "$IMAGE"
          echo "Published image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
